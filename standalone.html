<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuplex — Document AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<style>
  body { background:#020617; }
  [data-reveal]{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
  [data-reveal].in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){[data-reveal]{opacity:1;transform:none;transition:none}}
</style>

<div id="root"></div>

<script type="text/babel">
const { useEffect } = React;

const PAINS = [
  { icon:"M3 6h18M3 12h18M3 18h12", title:"เอกสารล้นมือ คีย์ไม่ทัน",
    desc:"ปริมาณเอกสารโตขึ้นทุกเดือน แต่กำลังคนเท่าเดิม งานคีย์ข้อมูลด้วยมือจึงขยายตามไม่ไหว" },
  { icon:"M12 9v4M12 17h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z", title:"คีย์ผิดเพราะเอกสารอ่านยาก",
    desc:"ชื่อบริษัท เลขผู้เสียภาษี และตัวเลขในเอกสารภาษาไทย อ่านสลับกันได้ง่าย ความผิดพลาดหลุดไปถึงปลายทาง" },
  { icon:"M4 4h7v7H4zM13 13h7v7h-7zM13 4h7v7h-7z", title:"แยกประเภทเอกสารผิดตั้งแต่ต้นทาง",
    desc:"ต้นฉบับกับสำเนาถูกสลับกันตั้งแต่ขั้นรับเอกสาร ทำให้ทุกขั้นตอนถัดไปพังตามกันเป็นลูกโซ่" },
  { icon:"M9 12l2 2 4-4M12 3a9 9 0 1 0 9 9", title:"QC ซ้ำซ้อน กินเวลาทีม",
    desc:"เวลาส่วนใหญ่หมดไปกับการไล่ตรวจงานเดิม แทนที่จะได้ใช้กับงานที่สร้างมูลค่าให้ธุรกิจจริง ๆ" },
];

const PRODUCTS = [
  { icon:"M4 5h16v14H4zM8 9h8M8 13h5", name:"OCR Engine",
    what:"อ่านภาพเอกสารและใบแจ้งหนี้ แล้วแปลงเป็นข้อความที่ค้นหาและนำไปใช้ต่อได้อัตโนมัติ",
    fix:"แก้ปัญหาข้อ 1 — ลดงานคีย์ด้วยมือ ทำให้รับเอกสารปริมาณมากได้" },
  { icon:"M4 4h7v7H4zM13 13h7v7h-7zM17 4v7M13.5 7.5h7", name:"Document Classification",
    what:"จำแนกประเภทเอกสารให้อัตโนมัติตั้งแต่ขั้นรับเข้า เช่น ต้นฉบับหรือสำเนา",
    fix:"แก้ปัญหาข้อ 3 — จัดเอกสารเข้าสายงานที่ถูกต้องตั้งแต่ต้นทาง" },
  { icon:"M12 3v4M5 8l3 2M19 8l-3 2M7 20h10l-1-6H8z", name:"NER Extraction",
    what:"สกัดฟิลด์สำคัญออกจากเอกสาร เช่น ชื่อบริษัท เลขผู้เสียภาษี วันที่ และยอดเงิน ในรูปแบบพร้อมใช้",
    fix:"แก้ปัญหาข้อ 2 — ลดการอ่านผิดและพิมพ์ผิดจากการคีย์ด้วยมือ" },
  { icon:"M4 19V5M4 19h16M8 15l3-4 3 3 4-6", name:"Evaluation Pipeline",
    what:"วัดคุณภาพของข้อมูลที่ดึงออกมาแบบอัตโนมัติ พร้อมชี้จุดที่ควรให้คนตรวจซ้ำก่อน",
    fix:"แก้ปัญหาข้อ 4 — โฟกัส QC เฉพาะเอกสารที่มีความเสี่ยง" },
];

// ponytail: placeholder data — เปลี่ยน username/name/role เป็นของทีมจริงได้เลย
const TEAM = [
  { username:"zuplex-lead",   name:"Somchai P.",  role:"ML Engineer / Team Lead" },
  { username:"zuplex-vision", name:"Nattaya K.",  role:"ML Engineer (OCR)" },
  { username:"zuplex-nlp",    name:"Pakorn S.",   role:"ML Engineer (NER)" },
  { username:"zuplex-api",    name:"Wirot T.",    role:"Backend Developer" },
  { username:"zuplex-data",   name:"Ploy M.",     role:"Data Annotator" },
  { username:"zuplex-ops",    name:"Anan R.",     role:"DevOps / MLOps" },
];

const ORG = "https://github.com/zuplex";

const Icon = ({ d, className = "w-6 h-6" }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"
       strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
    <path d={d} />
  </svg>
);

const Reveal = ({ i = 0, className = "", children, as: Tag = "div" }) => (
  <Tag data-reveal style={{ transitionDelay: (i * 90) + "ms" }} className={className}>{children}</Tag>
);

function Section({ id, eyebrow, title, sub, children }) {
  return (
    <section id={id} className="mx-auto max-w-6xl px-5 py-20 sm:py-28">
      <Reveal className="max-w-2xl">
        <p className="text-sm font-medium uppercase tracking-widest text-cyan-400">{eyebrow}</p>
        <h2 className="mt-3 text-3xl font-bold text-white sm:text-4xl">{title}</h2>
        {sub && <p className="mt-4 leading-relaxed text-slate-400">{sub}</p>}
      </Reveal>
      {children}
    </section>
  );
}

function Avatar({ username, name }) {
  return (
    <div className="relative grid h-20 w-20 place-items-center overflow-hidden rounded-full bg-gradient-to-br from-cyan-500/30 to-violet-500/30
                    ring-2 ring-white/10 transition group-hover:ring-cyan-400/60 sm:h-24 sm:w-24">
      <span className="text-xl font-semibold text-white/80">{name.slice(0, 1)}</span>
      <img src={"https://github.com/" + username + ".png"} alt={name} loading="lazy"
           className="absolute inset-0 h-full w-full object-cover"
           onError={(e) => { e.currentTarget.style.display = "none"; }} />
    </div>
  );
}

function App() {
  useEffect(() => {
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
      }),
      { threshold: 0.15, rootMargin: "0px 0px -40px" }
    );
    document.querySelectorAll("[data-reveal]").forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <div className="min-h-screen bg-slate-950 text-slate-300 selection:bg-cyan-400/30">

      {/* HERO */}
      <header className="relative overflow-hidden">
        <div className="pointer-events-none absolute -top-40 left-1/2 h-[32rem] w-[32rem] max-w-full -translate-x-1/2 rounded-full bg-cyan-500/20 blur-3xl" />
        <div className="pointer-events-none absolute right-0 top-20 h-80 w-80 max-w-full rounded-full bg-violet-600/20 blur-3xl" />
        <div className="relative mx-auto max-w-6xl px-5 pb-24 pt-20 sm:pb-32 sm:pt-32">
          <Reveal className="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-4 py-1.5 text-xs text-slate-300">
            <span className="h-1.5 w-1.5 rounded-full bg-cyan-400" /> AI/ML · Document Processing (OCR + NER)
          </Reveal>
          <Reveal i={1} as="h1" className="mt-6 max-w-3xl text-4xl font-bold leading-tight text-white sm:text-6xl">
            เปลี่ยนเอกสารนับพัน ให้กลายเป็น
            <span className="bg-gradient-to-r from-cyan-400 to-violet-400 bg-clip-text text-transparent"> ข้อมูลในไม่กี่วินาที</span>
          </Reveal>
          <Reveal i={2} as="p" className="mt-6 max-w-2xl text-lg leading-relaxed text-slate-400">
            เราสร้างระบบที่อ่าน จำแนก และสกัดข้อมูลจากเอกสารกระดาษและภาพสแกนให้เป็นข้อมูลพร้อมใช้
            เพื่อลดงานคีย์ด้วยมือ และให้ทีมได้ใช้เวลาไปกับงานที่สร้างมูลค่าจริง
          </Reveal>
          <Reveal i={3} className="mt-10 flex flex-col gap-3 sm:flex-row sm:items-center">
            <a href={ORG} target="_blank" rel="noreferrer"
               className="inline-flex items-center justify-center gap-2 rounded-xl bg-cyan-400 px-6 py-3 font-semibold text-slate-950 transition hover:bg-cyan-300">
              ดู GitHub Org
            </a>
            <a href="#products"
               className="inline-flex items-center justify-center gap-2 rounded-xl border border-white/15 bg-white/5 px-6 py-3 font-semibold text-white transition hover:bg-white/10">
              ดูตัวอย่างระบบ
            </a>
          </Reveal>
        </div>
      </header>

      {/* PAIN POINTS */}
      <Section id="pains" eyebrow="Pain Points" title="ปัญหาที่เราแก้ไข"
        sub="สิ่งที่ทีมปฏิบัติงานเจอทุกวันกับกองเอกสาร ก่อนจะมีระบบเข้ามาช่วย">
        <div className="mt-12 grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
          {PAINS.map((p, i) => (
            <Reveal key={p.title} i={i}
              className="rounded-2xl border border-white/10 bg-white/[0.03] p-6 transition hover:border-cyan-400/40 hover:bg-white/[0.06]">
              <div className="grid h-11 w-11 place-items-center rounded-xl bg-cyan-400/10 text-cyan-400">
                <Icon d={p.icon} />
              </div>
              <h3 className="mt-5 font-semibold text-white">{p.title}</h3>
              <p className="mt-2 text-sm leading-relaxed text-slate-400">{p.desc}</p>
            </Reveal>
          ))}
        </div>
      </Section>

      {/* PRODUCTS */}
      <Section id="products" eyebrow="Solutions" title="โซลูชันของเรา"
        sub="ชุดความสามารถที่ต่อกันเป็นสายงานเดียว ตั้งแต่รับภาพเอกสาร จนได้ข้อมูลที่ตรวจสอบย้อนกลับได้">
        <div className="mt-12 grid gap-5 sm:grid-cols-2">
          {PRODUCTS.map((p, i) => (
            <Reveal key={p.name} i={i}
              className="rounded-2xl border border-white/10 bg-gradient-to-b from-white/[0.06] to-transparent p-6 transition hover:border-violet-400/40 sm:p-7">
              <div className="flex items-start gap-4">
                <div className="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-cyan-400/20 to-violet-500/20 text-cyan-300">
                  <Icon d={p.icon} />
                </div>
                <div>
                  <h3 className="text-lg font-semibold text-white">{p.name}</h3>
                  <p className="mt-2 text-sm leading-relaxed text-slate-400">{p.what}</p>
                </div>
              </div>
              <p className="mt-5 rounded-lg border border-white/5 bg-slate-900/60 px-4 py-3 text-xs text-cyan-300/90">{p.fix}</p>
            </Reveal>
          ))}
        </div>
      </Section>

      {/* TEAM */}
      <Section id="team" eyebrow="Team" title="ทีมของเรา"
        sub="คนที่อยู่เบื้องหลังระบบ ตั้งแต่เตรียมข้อมูล เทรนโมเดล ไปจนถึงการดูแลระบบจริง">
        <div className="mt-12 grid grid-cols-2 gap-5 md:grid-cols-3 lg:grid-cols-4">
          {TEAM.map((m, i) => (
            <Reveal key={m.username} i={i}
              className="group flex flex-col items-center rounded-2xl border border-white/10 bg-white/[0.03] p-6 text-center transition hover:bg-white/[0.06]">
              <Avatar username={m.username} name={m.name} />
              <h3 className="mt-4 font-semibold text-white">{m.name}</h3>
              <p className="mt-1 text-xs text-slate-400">{m.role}</p>
              <a href={"https://github.com/" + m.username} target="_blank" rel="noreferrer"
                 className="mt-4 inline-flex items-center gap-1.5 rounded-lg border border-white/15 px-3 py-1.5 text-xs text-slate-200 transition hover:border-cyan-400/60 hover:text-cyan-300">
                <svg viewBox="0 0 16 16" fill="currentColor" className="h-4 w-4" aria-hidden="true">
                  <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38l-.01-1.49c-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
                </svg>
                GitHub
              </a>
            </Reveal>
          ))}
        </div>
      </Section>

      <footer className="border-t border-white/10">
        <div className="mx-auto flex max-w-6xl flex-col gap-3 px-5 py-10 text-sm text-slate-500 sm:flex-row sm:items-center sm:justify-between">
          <p>Zuplex · Document Processing (OCR + NER)</p>
          <a href={ORG} target="_blank" rel="noreferrer" className="transition hover:text-cyan-300">github.com/zuplex</a>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
